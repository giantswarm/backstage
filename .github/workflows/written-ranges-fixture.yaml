# Checks that the deployment page's copy of the edit template's written ranges
# equals the fixture the template tests in giantswarm/backstage-catalogs run
# against on its main branch: a range change on either side alone then fails
# CI (the unit tests check templateRange against the copy).
#
# Hand-authored (not devctl-generated), so it is safe to edit here.
name: Written ranges fixture

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: written-ranges-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the copy with backstage-catalogs main
        run: scripts/check-written-ranges-fixture.sh
