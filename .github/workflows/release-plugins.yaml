# Plugin release axis: changesets -> npm.
#
# The app axis (zz_generated.auto_release.yaml: git-cliff tags vX.Y.Z on every
# push to main, CircleCI publishes image and chart) and this axis share the
# repository but not their versions. The app follows conventional commits;
# the @giantswarm/backstage-plugin-* packages follow .changeset/*.md files.
#
# On every push to main, changesets/action does one of two things:
#
#   - Pending .changeset/*.md files: it pushes the branch changeset-release/main
#     and opens or refreshes the pull request "chore(release): version packages"
#     (yarn release:version), which turns the changesets into package.json
#     versions, per-package CHANGELOG.md entries and a refreshed yarn.lock.
#     Nothing is published.
#
#   - No pending changesets (the push merged that pull request): it builds the
#     packages and publishes every public package whose version is not on npm
#     yet (yarn release:publish). A docs: or chore: merge without a changeset
#     publishes nothing, every version is already on npm.
#
# The plugins get no git tags and no GitHub Releases. cliff.toml (generated by
# devctl) has no tag_pattern, so git-cliff takes the newest reachable tag of any
# shape as the app's last release and would compute the next app version from
# a @giantswarm/backstage-plugin-x@1.2.3 tag. The npm registry and the
# CHANGELOG.md files are the record of the plugin releases.
name: release-plugins

on:
  push:
    branches:
      - main

# One run at a time; a second push waits instead of racing the first.
concurrency:
  group: release-plugins-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # push changeset-release/main
  pull-requests: write # open and update the Version Packages pull request
  id-token: write # npm provenance attestation (Sigstore)

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Version packages or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # A bot token, not GITHUB_TOKEN: a pull request opened with
          # GITHUB_TOKEN gets no pull_request workflow runs, so the required
          # checks (pre-commit, semantic-pull-request, check-values-schema)
          # would never report and the Version Packages pull request could
          # not be merged.
          github-token: ${{ secrets.TAYLORBOT_GITHUB_ACTION }}
          # Push with the Git CLI. The GitHub API mode (the default) stages
          # every commit on a temporary branch changesets-ghcommit-temp/<branch>
          # that is pushed at main's HEAD first; CircleCI builds that branch like
          # any other, so every release commit also gets a branch pipeline whose
          # image jobs compute the release tag from the git state and push it a
          # second time from a non-release job (or hang and leave the release
          # commit red). The Git CLI pushes changeset-release/main directly. The
          # commits are the bot's and unsigned; the pull request is squash-merged.
          push-with-git-cli: true
          version-script: yarn release:version
          publish-script: yarn release:publish
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          create-github-releases: false
          push-git-tags: false
        env:
          # changesets 3 publishes through `yarn npm publish`; Yarn reads the
          # registry token from this variable (its npmAuthToken setting).
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Sigstore provenance on every published version
          # (Yarn's npmPublishProvenance setting).
          YARN_NPM_PUBLISH_PROVENANCE: 'true'
