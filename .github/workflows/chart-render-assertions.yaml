# Runs helm/backstage/tests/render-assertions.sh: assertions on the rendered
# chart for regressions that pass render, lint and schema checks but fail at
# runtime, silently (see the script's header).
#
# Hand-authored (not devctl-generated), so it is safe to edit here.
name: Chart render assertions

on:
  pull_request:
    paths:
      - 'helm/backstage/**'
      - '.github/workflows/chart-render-assertions.yaml'
  merge_group:
  push:
    branches:
      - main
    paths:
      - 'helm/backstage/**'
      - '.github/workflows/chart-render-assertions.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chart-render-assertions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-assertions:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # helm ships on the ubuntu-24.04 runner image.
      - name: Run the render assertions
        run: helm/backstage/tests/render-assertions.sh
