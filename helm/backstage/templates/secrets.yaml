---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
    {{- include "labels.backstage" $ | nindent 4 }}
data:
  {{- if .Values.aws.accessKeyID }}
  AWS_ACCESS_KEY_ID: {{ include "backstage.base64" (list "aws.accessKeyID" .Values.aws.accessKeyID) }}
  {{- end }}
  {{- if .Values.aws.secretAccessKey }}
  AWS_SECRET_ACCESS_KEY: {{ include "backstage.base64" (list "aws.secretAccessKey" .Values.aws.secretAccessKey) }}
  {{- end }}
  {{- if .Values.authSessionSecret }}
  AUTH_SESSION_SECRET: {{ include "backstage.base64" (list "authSessionSecret" .Values.authSessionSecret) }}
  {{- end }}
  {{- if .Values.circleci.apiToken }}
  CIRCLECI_API_TOKEN: {{ include "backstage.base64" (list "circleci.apiToken" .Values.circleci.apiToken) }}
  {{- end }}
  {{- if .Values.githubAuthCredentials.clientID }}
  GITHUB_OAUTH_CLIENT_ID: {{ include "backstage.base64" (list "githubAuthCredentials.clientID" .Values.githubAuthCredentials.clientID) }}
  {{- end }}
  {{- if .Values.githubAuthCredentials.clientSecret }}
  GITHUB_OAUTH_CLIENT_SECRET: {{ include "backstage.base64" (list "githubAuthCredentials.clientSecret" .Values.githubAuthCredentials.clientSecret) }}
  {{- end }}
  {{- if .Values.github.publicReadToken }}
  GITHUB_PUBLIC_READ_TOKEN: {{ include "backstage.base64" (list "github.publicReadToken" .Values.github.publicReadToken) }}
  {{- end }}
  {{- if .Values.grafana.apiToken }}
  GRAFANA_TOKEN: {{ include "backstage.base64" (list "grafana.apiToken" .Values.grafana.apiToken) }}
  {{- end }}
  {{- if .Values.sentry.app.dsn }}
  SENTRY_DSN_APP: {{ include "backstage.base64" (list "sentry.app.dsn" .Values.sentry.app.dsn) }}
  {{- end }}
  {{- if .Values.sentry.backend.dsn }}
  SENTRY_DSN_BACKEND: {{ include "backstage.base64" (list "sentry.backend.dsn" .Values.sentry.backend.dsn) }}
  {{- end }}
  {{- if .Values.sentry.reportURI }}
  SENTRY_REPORT_URI: {{ include "backstage.base64" (list "sentry.reportURI" .Values.sentry.reportURI) }}
  {{- end }}
  {{- /*
    TELEMETRYDECK_SALT is NOT a credential, despite sitting among these.

    The TelemetryDeck browser SDK computes sha256(userEntityRef + salt) in the
    browser, so the salt is served to every visitor as frontend app config and
    is readable from the page. Its purpose is to keep TelemetryDeck (the vendor)
    from storing plaintext user identities -- it does not protect against anyone
    who already holds those hashes, since our identifiers
    (user:default/<github-login>) are a small enumerable set.

    So: do not rotate it in response to it being "leaked". Rotating only
    publishes a different public value and resets user continuity in the
    analytics. It lives here because the app reads it as an env var alongside
    the real secrets. See giantswarm/giantswarm#37469.
  */}}
  {{- if .Values.telemetrydeck.salt }}
  TELEMETRYDECK_SALT: {{ include "backstage.base64" (list "telemetrydeck.salt" .Values.telemetrydeck.salt) }}
  {{- end }}
  {{- if .Values.externalAccess.mcpToken }}
  EXTERNAL_ACCESS_MCP_TOKEN: {{ include "backstage.base64" (list "externalAccess.mcpToken" .Values.externalAccess.mcpToken) }}
  {{- end }}
  {{- if .Values.anthropic.apiKey }}
  ANTHROPIC_API_KEY: {{ include "backstage.base64" (list "anthropic.apiKey" .Values.anthropic.apiKey) }}
  {{- end }}
  {{- if .Values.openai.apiKey }}
  OPENAI_API_KEY: {{ include "backstage.base64" (list "openai.apiKey" .Values.openai.apiKey) }}
  {{- end }}
  {{- if .Values.pagerduty.apiToken }}
  PAGERDUTY_TOKEN: {{ include "backstage.base64" (list "pagerduty.apiToken" .Values.pagerduty.apiToken) }}
  {{- end }}

{{- if .Values.githubAppCredentials }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-github-app-credentials-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
    {{- include "labels.backstage" $ | nindent 4 }}
stringData:
  github-app-credentials.yaml: |
    appId: {{ .Values.githubAppCredentials.appId | quote }}
    webhookUrl: {{ .Values.githubAppCredentials.webhookUrl | quote }}
    webhookSecret: {{ .Values.githubAppCredentials.webhookSecret | quote }}
    clientId: {{ .Values.githubAppCredentials.clientId | quote }}
    clientSecret: {{ .Values.githubAppCredentials.clientSecret | quote }}
    privateKey: |
      {{- .Values.githubAppCredentials.privateKey | nindent 6 }}
{{- end }}

{{- if .Values.google.credentialsJson }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-google-credentials-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
    {{- include "labels.backstage" $ | nindent 4 }}
stringData:
  credentials.json: |
    {{- .Values.google.credentialsJson | nindent 4 }}
{{- end }}

{{- if .Values.dexAuthCredentials }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-dex-auth-credentials-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
    {{- include "labels.backstage" $ | nindent 4 }}
data:
{{- range $key, $value := .Values.dexAuthCredentials }}
  AUTH_DEX_{{ $key | snakecase | upper }}_CLIENT_ID: {{ include "backstage.base64" (list (printf "dexAuthCredentials.%s.clientID" $key) $value.clientID) }}
  AUTH_DEX_{{ $key | snakecase | upper }}_CLIENT_SECRET: {{ include "backstage.base64" (list (printf "dexAuthCredentials.%s.clientSecret" $key) $value.clientSecret) }}
{{- end }}
{{- end }}

{{- if .Values.ociRegistryCredentials }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-oci-registry-credentials-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
    {{- include "labels.backstage" $ | nindent 4 }}
data:
{{- range $key, $value := .Values.ociRegistryCredentials }}
  OCI_REGISTRY_{{ $key | snakecase | upper }}_USERNAME: {{ include "backstage.base64" (list (printf "ociRegistryCredentials.%s.username" $key) $value.username) }}
  OCI_REGISTRY_{{ $key | snakecase | upper }}_PASSWORD: {{ include "backstage.base64" (list (printf "ociRegistryCredentials.%s.password" $key) $value.password) }}
{{- end }}
{{- end }}

{{- if .Values.pluginKeys }}
{{- range .Values.pluginKeys }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.name }}-plugin-key-{{ .keyId }}-secret
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $.Values.name }}
    {{- include "labels.backstage" $ | nindent 4 }}
stringData:
  public.key: {{- .publicKey | toYaml | indent 2  }}
  private.key: {{- .privateKey | toYaml | indent 2 }}
{{- end }}
{{- end }}
