{{- if .Values.backstage.appConfig }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-app-config-configmap
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
    {{- include "labels.backstage" $ | nindent 4 }}
data:
  app-config.yaml: {{- .Values.backstage.appConfig | toYaml | indent 2 }}
{{- end }}

{{- if .Values.sharedConfig }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-shared-config-configmap
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
    {{- include "labels.backstage" $ | nindent 4 }}
data:
  shared-config.yaml: {{- .Values.sharedConfig | toYaml | indent 2 }}
{{- end }}

{{- if .Values.branding.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-branding-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
    {{- include "labels.backstage" $ | nindent 4 }}
data:
  app-config-branding.yaml: |
    app:
      branding:
        assetsPath: {{ .Values.branding.assetsPath | quote }}
{{- end }}

{{- if eq .Values.database.engine "postgresql" }}
{{- /* The backend on the CNPG cluster: the image's base config pins
better-sqlite3, so without this block the engine deploys a cluster the
backend never uses. Schema division mode, because the CNPG `app` role may not
CREATE DATABASE, which the default division mode requires. TLS verified
against the cluster's CA, mounted beside it: CNPG accepts plaintext clients.
The deployment loads this file before appConfig and extraAppConfig, so an
operator's database block still wins. The file is plain YAML so the backend's
tests load it as the pod does; the chart adds the plugins' pools, which
release idle connections (min 0) and do not depend on the replicas, so a
scale changes no config and rolls no pod. */}}
{{- $databaseConfig := .Files.Get "files/app-config-database.yaml" | fromYaml }}
{{- $pool := .Values.database.postgresql.pool }}
{{- $_ := set $databaseConfig.backend.database "knexConfig" (dict "pool" (dict "min" 0 "max" (int $pool.max))) }}
{{- with $pool.plugins }}
{{- $plugins := dict }}
{{- range $plugin, $max := . }}
{{- $_ := set $plugins $plugin (dict "knexConfig" (dict "pool" (dict "max" (int $max)))) }}
{{- end }}
{{- $_ := set $databaseConfig.backend.database "plugin" $plugins }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-database-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
    {{- include "labels.backstage" $ | nindent 4 }}
data:
  app-config-database.yaml: |
    {{- toYaml $databaseConfig | nindent 4 }}
{{- end }}
