---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
    {{- include "labels.backstage" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.name }}
    component: backstage
  ports:
    - name: {{ .Values.name }}
      port: {{ .Values.port }}
      targetPort: http
    {{- if .Values.observability.metrics.enabled }}
    - name: metrics
      port: {{ .Values.observability.metrics.port }}
      targetPort: metrics
    {{- end }}
