# CI test case for Gateway API support
name: backstage
backstageDiscovery:
  kubernetesId: backstage
userID: 1000
groupID: 1000
image:
  name: backstage
  repository: giantswarm/backstage
port: 7007
registry:
  domain: gsoci.azurecr.io
authSessionSecret: Zm9vQmFy
circleci:
  apiToken: ZHVtbXlUb2tlbg==
dexAuthCredentials:
  example-1:
    clientID: ZXhhbXBsZU9uZUR1bW15Q2xpZW50SUQ=
    clientSecret: ZXhhbXBsZU9uZUR1bW15Q2xpZW50U2VjcmV0
githubAuthCredentials:
  clientID: ZHVtbXlDbGllbnRJRA==
  clientSecret: ZHVtbXlDbGllbnRTZWNyZXQ=
githubAppCredentials:
  appId: 42
  webhookUrl: 'dummyWehbookUrl'
  webhookSecret: 'dummyWebhookSecret'
  clientId: 'dummyClientID'
  clientSecret: 'dummyClientSecret'
  privateKey: |
    dummy
    private
    key
grafana:
  apiToken: ZHVtbXlUb2tlbg==
sentry:
  app:
    dsn: c3VtbXlTZW50cnlEU04=
  backend:
    dsn: c3VtbXlTZW50cnlEU04=
backstage:
  command: ['node', 'packages/backend']
  args: []
  extraAppConfig: []
  extraEnvVars: []
resources:
  verticalPodAutoscaler:
    enabled: true
  requests:
    cpu: 30m
    memory: 300M
  limits:
    cpu: 500m
    memory: 600M
database:
  engine: sqlite

# Disable traditional Ingress
ingress:
  enabled: false

# Enable Gateway API HTTPRoute
route:
  enabled: true
  kind: HTTPRoute
  hostnames:
    - backstage.example.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: giantswarm-default
      namespace: envoy-gateway-system
  matches:
    - path:
        type: PathPrefix
        value: /
  securityPolicy:
    enabled: true
    oidc:
      provider:
        issuer: https://dex.example.com
        authorizationEndpoint: https://dex.example.com/auth
        tokenEndpoint: https://dex.example.com/token
        clientID: backstage
        clientSecret:
          name: backstage-oidc-secret
      redirectURL: https://backstage.example.com/oauth2/callback
  backendTrafficPolicy:
    enabled: true
    spec:
      timeout:
        http:
          requestTimeout: '10m'
          connectionIdleTimeout: '20m'
