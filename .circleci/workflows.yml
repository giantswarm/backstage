# DO NOT EDIT. This file is generated by `devctl gen circleci` and kept in sync
# by the giantswarm/github align-files workflow. Change the generator in devctl
# (pkg/gen/input/circleci) or the gen.ci config in giantswarm/github, not here.
# Repo-specific jobs and workflows go in .circleci/custom.yml, which the setup
# workflow in .circleci/config.yml merges into this file at pipeline runtime.
version: 2.1
orbs:
  architect: giantswarm/architect@10.15.1

commands:
  # Pre-steps of the chart-test jobs: pull the images run-tests-with-ats starts
  # (app-test-suite, the kind node) before the orb does, so `docker run` and
  # `kind create cluster` find them locally. The pull is logged in with the
  # registry's credentials from the architect context: ACR throttles all
  # anonymous pulls of a registry together as one identity, an authenticated
  # pull has its own budget. A transient `toomanyrequests` (or any failed pull)
  # is retried with backoff; ACR's Retry-After counts down to the end of its
  # throttling period, at most about a minute, which the longer delays cover.
  pull-chart-test-images:
    parameters:
      registry:
        type: string
      images:
        description: Images to pull, space-separated.
        type: string
    steps:
    - run:
        name: Pull chart-test images (logged in, with retry)
        environment:
          PULL_REGISTRY: << parameters.registry >>
          PULL_IMAGES: << parameters.images >>
        command: |
          delays="15 30 60 60 60"
          retry() {
            for delay in $delays ""; do
              if "$@"; then return 0; fi
              [ -n "$delay" ] || return 1
              echo "Attempt failed, retrying in ${delay}s: $*"
              sleep "$delay"
            done
          }

          # Same input as architect/image-login-to-registries: one registry per
          # line, "visibility registry username_envvar password_envvar push_dev".
          # No xtrace: the loop resolves the password.
          set +x
          username_val=""
          password_val=""
          while read -r _ reg username password _; do
            [ "$reg" = "$PULL_REGISTRY" ] && [ -n "$username" ] && [ -n "$password" ] || continue
            case "$username$password" in *[!a-zA-Z0-9_]*) echo "Invalid credential variable name for $reg" >&2; exit 1 ;; esac
            eval "username_val=\${$username:-}"
            eval "password_val=\${$password:-}"
          done \<<EOF
          $(printf '%s' "${REGISTRIES_DATA_BASE64:-}" | base64 -d)
          EOF
          login() {
            printf '%s' "$password_val" | docker login "$PULL_REGISTRY" --username "$username_val" --password-stdin
          }
          if [ -z "$username_val" ] || [ -z "$password_val" ]; then
            echo "No $PULL_REGISTRY credentials in the job's context: pulling anonymously."
          elif ! retry login; then
            echo "Login to $PULL_REGISTRY failed: pulling anonymously."
          fi

          for image in $PULL_IMAGES; do
            if ! retry docker pull "$image"; then
              echo "Pulling $image failed after every retry." >&2
              exit 1
            fi
          done

jobs:
  # Self-contained Node build/test on a cimg/node executor (architect ships no
  # Node job). Dependencies are restored from a cache keyed on the lockfile
  # checksum and saved write-once-per-lockfile, the Node analogue of go-build's
  # GOCACHE persist. The verify/build steps invoke package.json scripts, so a
  # repo redirects its bespoke toolchain by editing those scripts, not this job.
  node-build:
    docker:
    - image: cimg/node:24.22.2
    resource_class: large
    # Worker counts sized from the resource class's memory, not from the CPUs
    # the tools detect (the Docker executor shows the host's count to
    # os.cpus(), the cgroup's quota to jest), which start more workers than the
    # class has memory for. backstage-cli's repo lint and repo build read
    # BACKSTAGE_CLI_CONCURRENCY; jest reads no variable, so the repo's test
    # script passes --maxWorkers=${JEST_MAX_WORKERS:-40%}. A repo that raises
    # resource_class or adds a service container in .circleci/custom.yml sets
    # both under this job's environment there; its values win the merge.
    environment:
      BACKSTAGE_CLI_CONCURRENCY: "1"
      JEST_MAX_WORKERS: "2"
    steps:
    - checkout
    - restore_cache:
        keys:
        - node-deps-yarn-v1-{{ checksum "yarn.lock" }}
        - node-deps-yarn-v1-
    # Build-output cache: restore the materialized node_modules (with its
    # compiled native addons) so the install reconciles incrementally instead
    # of recompiling better-sqlite3/isolated-vm/etc. from source via node-gyp
    # every run. Keyed on the node image version -- a node bump must not restore
    # stale-ABI binaries. The Node analogue of go-build's $GOCACHE persist.
    # Exact key only: another lockfile's tree would make the install reconcile
    # partially and skip postinstall (patch-package), see devctl#2183.
    - restore_cache:
        keys:
        - node-build-yarn-v2-24.22.2-{{ checksum "yarn.lock" }}
    - run:
        name: Install dependencies
        command: yarn install --immutable
    - save_cache:
        key: node-deps-yarn-v1-{{ checksum "yarn.lock" }}
        paths:
        - .yarn/cache
    - run:
        # ci:verify -- the node analogue of `make test`. The repo composes its
        # ENTIRE correctness gate into this one script: tsc --noEmit + lint +
        # prettier --check + unit tests, in one process. Lint and format live
        # HERE and nowhere else in CI (verify-canonical: the CI pre-commit job
        # carries no JS/TS hook), so the build step must not redo them. The
        # default testTarget `test` is only a FLOOR -- a bare `test` script
        # gates tests alone; repos define an explicit composed ci:verify
        # (backstage is the reference). The script must NOT run its own install
        # -- the job already did, once. See the node-ci-verify-build-single-pass
        # ADR for the full single-pass contract.
        name: Verify
        command: yarn run ci:verify
    - run:
        # ci:build -- the node analogue of `make build`. Bundle/emit ONLY: it
        # produces the shippable artifact and does NOTHING ci:verify already did
        # (no second typecheck, no re-lint, no re-test, no re-install). Framework
        # builds redo checks by default (`next build` runs eslint + tsc; webpack
        # eslint-loader re-lints; a `tsc` build emits *and* typechecks) -- disable
        # the redundant check in the build config so this stays bundle-only, or
        # for a pure-`tsc` library make the single emitting `tsc` the testTarget
        # and leave buildTarget empty.
        name: Build
        command: yarn run ci:build
    # Save the build-output cache *after* verify/build so it captures both the
    # node_modules native addons compiled during install AND the tsc/eslint/jest
    # incremental caches those steps write under node_modules/.cache -- the
    # compute-side analogue of persisting $GOCACHE. Write-once per lockfile.
    - save_cache:
        key: node-build-yarn-v2-24.22.2-{{ checksum "yarn.lock" }}
        paths:
        - node_modules
        - .yarn/install-state.gz
    - persist_to_workspace:
        # Hand the build output to the image jobs, which attach_workspace and
        # overlay it into the Docker build context (gen.ci.image.preBuildJob).
        root: .
        paths:
        - packages/*/dist/*

workflows:
  build:
    jobs:
    - node-build:
        filters:
          tags:
            only: /^v.*/

    # Native per-architecture image build (opt-in): one architect/build-image
    # job per platform, each on a resource class of that architecture, so no
    # RUN step is emulated. The jobs run concurrently and push their platform
    # by digest; a push-to-registries job with merge-digests: true joins the
    # digests into the tagged index, signs and attests it. The platform list on
    # the merge job must match the set of build jobs, and split-china-push /
    # force-public must be identical on all of them -- the generator keeps
    # them in step.
    #
    # Branch builds (opt-in) publish a dev image, coupled with the branch chart
    # push below.
    - architect/build-image:
        context: architect
        name: build-image-amd64
        platform: linux/amd64
        resource_class: small
        dockerfile: packages/backend/Dockerfile
        requires:
        - node-build
        filters:
          branches:
            ignore:
            - main
            - /^release-v?[0-9]+(\.[0-9]+)?\.x$/
    - architect/build-image:
        context: architect
        name: build-image-arm64
        platform: linux/arm64
        resource_class: arm.medium
        dockerfile: packages/backend/Dockerfile
        requires:
        - node-build
        filters:
          branches:
            ignore:
            - main
            - /^release-v?[0-9]+(\.[0-9]+)?\.x$/

    # Joins the per-architecture digests into the tagged dev index. Same job
    # name as the single-job shape, so execute-chart-tests, push-chart and
    # repo-owned custom.yml jobs keep resolving.
    - architect/push-to-registries:
        context: architect
        name: push-to-registries
        merge-digests: true
        platforms: "linux/amd64,linux/arm64"
        requires:
        - build-image-amd64
        - build-image-arm64
        filters:
          branches:
            ignore:
            - main
            - /^release-v?[0-9]+(\.[0-9]+)?\.x$/

    # Tag builds: one native build per architecture, then
    # push-to-registries-release joins the digests into the tagged index in
    # gsoci + gsociprivate, signs and attests it. Aliyun is handled by the
    # sync-china-registry job below (the orb's split-china-push mechanism), so
    # no push crosses the Pacific. Each build job pushes its platform BY
    # DIGEST, setting no tag: a single-architecture manifest is not
    # independently useful, and tagging one would publish something consumers
    # could pull by accident.
    - architect/build-image:
        context: architect
        name: build-image-release-amd64
        platform: linux/amd64
        resource_class: small
        dockerfile: packages/backend/Dockerfile
        split-china-push: true
        requires:
        - node-build
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/
    - architect/build-image:
        context: architect
        name: build-image-release-arm64
        platform: linux/arm64
        resource_class: arm.medium
        dockerfile: packages/backend/Dockerfile
        split-china-push: true
        requires:
        - node-build
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/

    - architect/push-to-registries:
        context: architect
        name: push-to-registries-release
        merge-digests: true
        platforms: "linux/amd64,linux/arm64"
        split-china-push: true
        requires:
        - build-image-release-amd64
        - build-image-release-arm64
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/

    # Mirror gsoci -> Aliyun via the in-China giantswarm/galaxy-runner. Runs
    # in parallel with the chart catalog push; Aliyun mirror failures do NOT
    # block the chart publish.
    - architect/sync-china-registry:
        context: architect
        name: sync-china-registry
        requires:
        - push-to-registries-release
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/

    # build-chart: package + lint via app-build-suite and persist the archive
    # (no push). Shared by the branch and tag paths -- branches get build + test
    # only by default.
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: build-chart
        app_catalog: giantswarm-operations-platform-catalog
        app_catalog_test: giantswarm-operations-platform-test-catalog
        chart: backstage
        push_to_appcatalog: false
        push_to_oci_registry: false
        persist_chart_archive: true
        # app-build-suite fails a chart whose gsoci image references the registry
        # does not carry. build-chart runs before this pipeline pushes its own
        # image (a branch without branchPublish never pushes it), so that image
        # at the version the chart is stamped with is exempt here; every other
        # reference, the mirrored third-party images included, is resolved.
        # push-chart and push-chart-release require the image job and resolve
        # all of them.
        pre-steps:
        - run:
            name: Exempt this pipeline's own image from the image reference check
            command: echo 'export ABS_HELM_IMAGE_REFERENCE_VALIDATOR_OWN_IMAGE=gsoci.azurecr.io/giantswarm/backstage' >> "$BASH_ENV"
        requires:
        - node-build
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main
            - /^release-v?[0-9]+(\.[0-9]+)?\.x$/

    # Branch: run chart tests after build-chart. When branchPublish pushes a dev
    # image, the test also waits on push-to-registries -- run-tests-with-ats
    # deploys the chart, which pulls that image from gsoci, and gating on the
    # push avoids an ImagePullBackOff race. The architect context carries the
    # registry credentials the job hands to its kind node, so the chart can pull
    # private images (gsociprivate) without imagePullSecrets. The kind cluster
    # the job creates takes its configuration (feature gates, runtime config,
    # patches, extra nodes) from .ats/kind-config.yaml when the repo carries one
    # -- repo-owned, like .ats/main.yaml -- and its resource class from
    # gen.ci.atsResourceClass in giantswarm/github (the orb default is medium).
    # Its pre-steps pull the images it starts logged in and with retry (see
    # pull-chart-test-images above).
    - architect/run-tests-with-ats:
        name: execute-chart-tests
        context: architect
        app-test-suite_container_tag: "1.0.3"
        # app-test-suite 1.x provisions no cluster: the job creates the kind
        # cluster and runs the pinned image against its kubeconfig.
        create_kind_cluster: true
        kind_node_image: "gsoci.azurecr.io/giantswarm/kind-node:v1.37.0"
        pre-steps:
        - pull-chart-test-images:
            registry: gsoci.azurecr.io
            images: "gsoci.azurecr.io/giantswarm/app-test-suite:1.0.3 gsoci.azurecr.io/giantswarm/kind-node:v1.37.0"
        requires:
        - build-chart
        - push-to-registries
        filters:
          branches:
            ignore:
            - main
            - /^release-v?[0-9]+(\.[0-9]+)?\.x$/

    # Branch chart push (opt-in): publish the dev chart after tests + the amd64
    # branch image, coupled with push-to-registries above.
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: push-chart
        app_catalog: giantswarm-operations-platform-catalog
        app_catalog_test: giantswarm-operations-platform-test-catalog
        chart: backstage
        requires:
        - execute-chart-tests
        - push-to-registries
        filters:
          branches:
            ignore:
            - main
            - /^release-v?[0-9]+(\.[0-9]+)?\.x$/

    # Tag: push the chart after build-chart (+ the gsoci image). The chart
    # tests ran on the branch (execute-chart-tests) and the tag is cut from the
    # merge commit of a PR whose branch run tested this tree, so they are not
    # re-run here (atsOnRelease brings the tag-time run back). Make the
    # ci/circleci statuses required checks on the default branch, with
    # up-to-date branches (strict), so a PR cannot merge before that run is
    # green. Intentionally does NOT depend on sync-china-registry so the chart
    # catalog can publish even if the in-China Aliyun mirror is slow or fails.
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: push-chart-release
        app_catalog: giantswarm-operations-platform-catalog
        app_catalog_test: giantswarm-operations-platform-test-catalog
        chart: backstage
        requires:
        - build-chart
        - push-to-registries-release
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/
