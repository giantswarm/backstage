# Repo-specific CircleCI jobs. The dynamic-config setup workflow in
# .circleci/config.yml deep-merges this file into the generated
# .circleci/workflows.yml at pipeline runtime (yq `*+`: maps merge, job lists
# append). devctl never touches this file.
#
# Generated job names available to reference in `requires`: node-build (the
# install/verify/build job that persists packages/*/dist/*), push-to-registries
# (branch), push-to-registries-release, sync-china-registry, build-chart,
# execute-chart-tests, push-chart-release (the operations-platform catalog
# push). The chart tests run on branches only; there is no tag-time
# execute-chart-tests-release since devctl v8.45.0 (gen.ci.atsOnRelease would
# bring it back).
#
# What this file carries beyond the golden pipeline:
#   - the node-build job's size, its Postgres service and a last step that
#     checks the production app bundle for fixture code.
#   - push-to-control-plane-app-catalog: backstage ships the single `backstage`
#     chart to TWO catalogs. The generated push-chart-release publishes to the
#     operations-platform catalog (gen.ci.appCatalog); this carries the second
#     control-plane catalog push.
#
# The Node build (install/verify/build -> packages/*/dist/*) is now the
# generated `node-build` job (gen.ci.node), which the image jobs require for the
# workspace handoff; the hand-written `buildjob` it replaced lived here before.
version: 2.1

jobs:
  # Extend the generated `node-build` job. The dynamic-config deep-merge (yq
  # `*+`) merges this map into the generated jobs.node-build: scalars from
  # custom.yml win, and lists append, so the `docker` and `steps` below come
  # after the generated ones. resource_class is bumped from large (4 vCPU /
  # 8 GB) to xlarge (8 vCPU / 16 GB) to speed up install/verify/build.
  #
  # The `docker` list appends to the generated one, so the Postgres 18
  # container runs as a service beside the primary cimg/node container and
  # answers on localhost. TestDatabases (@backstage/backend-test-utils) reads
  # the connection string and runs every test declaring POSTGRES_18 against
  # it; the job has no Docker of its own, so without the variable those cases
  # would not run. Under CI a test file declaring POSTGRES_18 fails when the
  # variable is missing instead of skipping.
  #
  # The Postgres container shares the job's 16 GiB with `ci:verify`
  # (scripts/ci-verify.sh), and both parallel tools in it size themselves from
  # the CPUs they see: the lint takes half of the host's 36 (`nproc` on the
  # Docker executor), jest 40% of the 16 the cgroup grants. Unbounded, with
  # tsc, the lint and jest running at once, that outgrew the memory and the
  # kernel killed Postgres (exit 137) early in Verify, and the oversubscribed
  # CPUs pushed the heaviest render tests past jest's 5 s (#3045 bounded them
  # to 4 workers and 2 lint threads: 11.4 GiB at the peak). On #3326, jest
  # alone with 6 workers and no coverage peaked between 10.5 and 12.1 GiB
  # over four runs, tsc beside the lint at 6.4 GiB at most; with 7 workers
  # the jest phase peaked at 13.9 GiB, 2.5 GiB under the limit, too close for
  # a gate that must not flake, so 6 it is. The lint took the same 101 s
  # alone as beside jest, bound by its 2 threads, so phase 2 gives it 4: it
  # runs beside the single-threaded tsc on 8 CPUs.
  # `ci:verify` runs in two phases now: jest alone first, with the whole job to
  # itself (JEST_MAX_WORKERS workers, no coverage), then tsc and the lint side
  # by side. Each phase peaks lower than the three did together, and the end
  # of the Verify log carries each phase's duration and the cgroup's peak
  # memory, the inputs for tuning these two. BACKSTAGE_CLI_CONCURRENCY sizes
  # the lint (and the later build), JEST_MAX_WORKERS the jest pool `ci:test`
  # starts.
  #
  # CircleCI keeps only the tail of a step's output (about 400 KB), and jest's
  # output alone outgrows it. tsc and the lint therefore run after jest, under
  # `concurrently --group`, so a type or lint error is always at the end of
  # the Verify log.
  #
  # `parallelism` runs the job on that many containers at once, each an xlarge
  # with its own Postgres. `ci:verify` gives each container its shard of the
  # tests (jest's `--shard`, split by a hash of each file's path, so the split
  # is the same on every run), runs tsc and the lint on the last container and
  # ends every container but 0 before the generated Build and
  # persist_to_workspace steps, which must run once: CircleCI refuses to
  # attach a workspace two containers persisted the same file into. The tests
  # are 450 of the job's 640 s on one container; on two (#3330, first runs)
  # each shard took 240 to 300 s, the job 6.8 and 7.4 min, for about 20% more
  # credits: each container's start, each shard's own jest start-up, and the
  # last container's tsc and lint (97 s) after its tests. The saved
  # node_modules cache comes from container 0 only, so the other shard's jest
  # transform cache is cold after a lockfile change.
  node-build:
    resource_class: xlarge
    parallelism: 2
    docker:
    - image: cimg/postgres:18.6
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
    environment:
      BACKSTAGE_CLI_CONCURRENCY: "4"
      JEST_MAX_WORKERS: "6"
      BACKSTAGE_TEST_DATABASE_POSTGRES18_CONNECTION_STRING: postgresql://postgres:postgres@localhost:5432
    # Appended after the generated steps, so it runs on container 0 only (the
    # others halt in Verify), after Build has built the app. It fails when
    # fixture code reached the production bundle (docs/fixtures.md).
    steps:
    - run:
        name: Check the app bundle for fixture code
        command: yarn run ci:bundle-fixtures

workflows:
  build:
    jobs:
    # Second catalog: the single `backstage` chart also ships to the
    # control-plane catalog. Gated on the same jobs as the generated
    # push-chart-release (operations-platform): the build-chart archive and the
    # released image, so both catalogs publish the same tested archive (the
    # chart tests ran on the PR that the tag was cut from). Like every
    # generated chart job it requires pin-version and attaches the workspace,
    # so it stamps the version resolved once at the start of the workflow
    # (.pipeline_version) instead of resolving its own.
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: push-to-control-plane-app-catalog
        app_catalog: control-plane-catalog
        app_catalog_test: control-plane-test-catalog
        chart: backstage
        attach_workspace: true
        requires:
        - pin-version
        - build-chart
        - push-to-registries-release
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/
