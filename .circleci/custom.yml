# Repo-specific CircleCI jobs. The dynamic-config setup workflow in
# .circleci/config.yml deep-merges this file into the generated
# .circleci/workflows.yml at pipeline runtime (yq `*+`: maps merge, job lists
# append). devctl never touches this file.
#
# Generated job names available to reference in `requires`: node-build (the
# install/verify/build job that persists packages/*/dist/*), push-to-registries
# (branch), push-to-registries-release, sync-china-registry, build-chart,
# execute-chart-tests, push-chart-release (the operations-platform catalog
# push). The chart tests run on branches only; there is no tag-time
# execute-chart-tests-release since devctl v8.45.0 (gen.ci.atsOnRelease would
# bring it back).
#
# What this file carries beyond the golden pipeline:
#   - push-to-control-plane-app-catalog: backstage ships the single `backstage`
#     chart to TWO catalogs. The generated push-chart-release publishes to the
#     operations-platform catalog (gen.ci.appCatalog); this carries the second
#     control-plane catalog push.
#
# The Node build (install/verify/build -> packages/*/dist/*) is now the
# generated `node-build` job (gen.ci.node), which the image jobs require for the
# workspace handoff; the hand-written `buildjob` it replaced lived here before.
version: 2.1

jobs:
  # Override just the resource_class of the generated `node-build` job. The
  # dynamic-config deep-merge (yq `*+`) merges this map into the generated
  # jobs.node-build; scalars from custom.yml win, so `docker`/`steps` stay as
  # generated and only the executor size changes. Bumped from large (4 vCPU /
  # 8 GB) to xlarge (8 vCPU / 16 GB) to speed up install/verify/build.
  #
  # The `docker` list appends to the generated one, so the Postgres 18
  # container runs as a service beside the primary cimg/node container and
  # answers on localhost. TestDatabases (@backstage/backend-test-utils) reads
  # the connection string and runs every test declaring POSTGRES_18 against
  # it; the job has no Docker of its own, so without the variable those cases
  # would not run. Under CI a test file declaring POSTGRES_18 fails when the
  # variable is missing instead of skipping.
  #
  # The Postgres container shares the job's 16 GiB with `ci:verify`, which
  # runs tsc, the lint and jest at once, and both parallel tools size
  # themselves from the CPUs they see: the lint takes half of the host's 36
  # (`nproc` on the Docker executor), jest 40% of the 16 the cgroup grants.
  # Unbounded, that outgrew the memory and the kernel killed Postgres
  # (exit 137) early in Verify, and the oversubscribed CPUs pushed the heaviest
  # render tests past jest's 5 s. Bounded, measured at the peak: jest 4
  # workers 6 GiB, tsc 4.2 GiB, the rest 2.3 GiB, 11.4 GiB anonymous in all.
  # BACKSTAGE_CLI_CONCURRENCY sizes the lint (and the later build),
  # JEST_MAX_WORKERS the jest pool `test:all` starts.
  #
  # CircleCI keeps only the tail of a step's output (about 400 KB), and jest's
  # output alone outgrows it. `ci:verify` therefore runs the three with
  # `concurrently --group`, jest first: jest streams live, tsc's and the lint's
  # output is held back and printed after it, so a type or lint error is always
  # at the end of the Verify log.
  node-build:
    resource_class: xlarge
    docker:
    - image: cimg/postgres:18.6
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
    environment:
      BACKSTAGE_CLI_CONCURRENCY: "2"
      JEST_MAX_WORKERS: "4"
      BACKSTAGE_TEST_DATABASE_POSTGRES18_CONNECTION_STRING: postgresql://postgres:postgres@localhost:5432

workflows:
  build:
    jobs:
    # Second catalog: the single `backstage` chart also ships to the
    # control-plane catalog. Gated on the same jobs as the generated
    # push-chart-release (operations-platform): the build-chart archive and the
    # released image, so both catalogs publish the same tested archive (the
    # chart tests ran on the PR that the tag was cut from).
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: push-to-control-plane-app-catalog
        app_catalog: control-plane-catalog
        app_catalog_test: control-plane-test-catalog
        chart: backstage
        requires:
        - build-chart
        - push-to-registries-release
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/
